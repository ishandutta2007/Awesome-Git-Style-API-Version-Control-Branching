<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0c16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070913"/></linearGradient><radialGradient id="orb1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="orb2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".3"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient><radialGradient id="orb3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#10b981" stop-opacity=".25"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/></radialGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width=".7" d="M 40 0 L 0 0 0 40" opacity=".6"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{transform:scale(1) translate(0,0);opacity:.4}}@keyframes nodeGlow{0%{r:5;opacity:.6}}.pulse-slow{animation:pulse 8s ease-in-out infinite alternate}.pulse-fast{animation:pulse 5s ease-in-out infinite alternate}.dash-flow{stroke-dasharray:8 6;animation:flow 20s linear infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g><circle cx="200" cy="120" r="180" fill="url(#orb1)" class="pulse-slow"/><circle cx="1020" cy="300" r="220" fill="url(#orb2)" class="pulse-fast"/><circle cx="950" cy="90" r="140" fill="url(#orb3)" class="pulse-slow"/></g><g opacity=".4" transform="translate(0, 40)"><path stroke="#38bdf8" stroke-width="2.5" d="M 50 310 L 1150 310" class="dash-flow"/><path fill="none" stroke="#a855f7" stroke-dasharray="6 4" stroke-width="2" d="M 280 310 C 340 310, 360 250, 430 250 L 750 250 C 810 250, 830 310, 890 310"/><path fill="none" stroke="#10b981" stroke-dasharray="4 4" stroke-width="1.8" d="M 500 250 C 550 250, 570 190, 630 190 L 700 190 C 740 190, 760 250, 800 250"/><circle cx="280" cy="310" r="6" fill="#38bdf8"/><circle cx="430" cy="250" r="6" fill="#a855f7"/><circle cx="630" cy="190" r="6" fill="#10b981"/><circle cx="700" cy="190" r="6" fill="#10b981"/><circle cx="800" cy="250" r="6" fill="#a855f7"/><circle cx="890" cy="310" r="6" fill="#38bdf8"/></g><g transform="translate(600, 75)"><rect width="390" height="32" x="-195" y="-16" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><circle cx="-170" cy="0" r="5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"/></circle><text x="-152" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">SPEC-FIRST VERSION CONTROL &amp; FORGES</text></g><text x="600" y="150" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-.5" text-anchor="middle">Git-Style API Version Control &amp; Branching</text><text x="600" y="195" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Curated Hub of SaaS Platforms, Self-Hosted Git Forges &amp; Spec-First Workflows</text><text x="600" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">OpenAPI Reviews • Trunk-Based Branching • PR/MR Gatekeeping • Self-Hosted Sovereignty</text><g><g transform="translate(600, 300) translate(-320, 0)"><rect width="170" height="32" x="-85" y="-16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity=".9" rx="8"/><text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌿 Branching Models</text></g><g transform="translate(600, 300) translate(-105, 0)"><rect width="180" height="32" x="-90" y="-16" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity=".9" rx="8"/><text x="0" y="5" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔄 Merge Request PRs</text></g><g transform="translate(600, 300) translate(105, 0)"><rect width="180" height="32" x="-90" y="-16" fill="#1e293b" stroke="#c084fc" stroke-width="1" opacity=".9" rx="8"/><text x="0" y="5" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Branch Protection</text></g><g transform="translate(600, 300) translate(320, 0)"><rect width="170" height="32" x="-85" y="-16" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity=".9" rx="8"/><text x="0" y="5" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Self-Hosted Forges</text></g></g><rect width="1198" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" opacity=".5" rx="15"/></svg>